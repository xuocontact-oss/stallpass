<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1c1917">
  <p style="font-weight:700;font-size:18px;color:#e0592a;margin:0 0 16px">Stallpass</p>
  <p>Your sign-in code:</p>
  <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:8px 0 16px">{{ .Token }}</p>
  <p>Type it into the Stallpass screen you have open. It works for 1 hour.</p>
  <p style="margin:24px 0">Or tap: <a href="{{ .ConfirmationURL }}" style="color:#e0592a;font-weight:600">Sign in to Stallpass</a></p>
  <p style="font-size:12px;color:#78716c">Didn't ask for this? You can ignore this email.</p>
</div>
